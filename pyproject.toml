[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beutilogs"
version = "0.1.0"
description = "Error logging that points at the line that actually broke - not a blank one."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YESSS-STAR" }]
keywords = ["logging", "traceback", "errors", "debugging", "exceptions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/YESSS-STAR/beutilogs"
Source = "https://github.com/YESSS-STAR/beutilogs"
Issues = "https://github.com/YESSS-STAR/beutilogs/issues"

[tool.setuptools.packages.find]
where = ["src"]
